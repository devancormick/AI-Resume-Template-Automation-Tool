<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Resume -> DOCX Template Automation</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main>
      <h1>AI Resume -> DOCX Template Automation</h1>

      <section class="card">
        <h2>1) Upload Resume</h2>
        <div id="resumeDrop" class="dropzone" role="button" tabindex="0">
          Drop resume here (PDF/DOCX) or click to choose
        </div>
        <input id="resume" class="hidden" type="file" accept=".pdf,.docx" />
        <button id="parseBtn" type="button">Extract & Preview</button>
      </section>

      <section class="card">
        <h2>2) Upload Template (.docx)</h2>
        <div id="templateDrop" class="dropzone" role="button" tabindex="0">
          Drop DOCX template here or click to choose
        </div>
        <input id="template" class="hidden" type="file" accept=".docx" />
        <p class="hint">
          Template placeholders should be bracket tags like <code>[NAME]</code>, <code>[EXPERIENCE]</code>.
        </p>
      </section>

      <section class="card">
        <h2>3) Edit Extracted JSON (optional)</h2>
        <textarea id="jsonPreview" spellcheck="false" rows="14" placeholder="Click 'Extract & Preview' first..."></textarea>
        <div class="row">
          <button id="formatBtn" type="button">Generate DOCX</button>
          <button id="clearBtn" type="button" class="secondary">Clear</button>
        </div>
      </section>

      <section class="card">
        <h2>Errors</h2>
        <pre id="errorBox" class="error"></pre>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
